services:
  - type: web
    name: book-recommender
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/start_web.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATA_DIR
        value: /tmp/book-recommender-data
      - key: HF_HOME
        value: /tmp/book-recommender-data/huggingface
      - key: BOOK_DATA_URL
        sync: false
      - key: BOOK_DATA_TOKEN
        sync: false
      - key: BOOK_DATA_SHA256
        sync: false
